# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  IMAGE: almena-mediator:dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Create .env from .env.example with a fresh TURN secret (an existing .env is left untouched)
    cmds:
      - cp .env.example .env
      - sed -i.bak "s/^ALMENA_TURN_SECRET=$/ALMENA_TURN_SECRET=$(openssl rand -hex 32)/" .env && rm .env.bak
    status:
      - test -f .env

  redis:
    desc: Start Redis in Docker (for task dev), reachable on 127.0.0.1
    cmds:
      - docker compose up --detach --wait redis

  turn:
    desc: Start the TURN relay (coturn) in Docker, for calls (with task dev or dev:memory)
    cmds:
      - docker compose --profile turn up --detach coturn

  dev:
    desc: Run the mediator locally with readable debug logs; Redis must be running (task redis)
    env:
      ALMENA_LOG_FORMAT: pretty
      ALMENA_REDIS_URL: redis://127.0.0.1:{{.ALMENA_REDIS_PORT | default "6379"}}
      RUST_LOG: '{{.RUST_LOG | default "almena_mediator=debug,tower_http=debug,info"}}'
    cmds:
      - cargo run

  dev:memory:
    desc: Run the mediator locally without Docker, storing everything in memory (lost on restart)
    env:
      ALMENA_LOG_FORMAT: pretty
      ALMENA_REDIS_URL: memory://
      RUST_LOG: '{{.RUST_LOG | default "almena_mediator=debug,tower_http=debug,info"}}'
    cmds:
      - cargo run

  smoke:
    desc: "End-to-end check of a running mediator: mediation, a forwarded message, pickup (URL: task smoke -- http://host:port)"
    cmds:
      - cargo run --quiet -p almena-mediator --example smoke -- {{.CLI_ARGS | default (printf "http://localhost:%s" (.ALMENA_MEDIATOR_PORT | default "8080"))}}

  build:
    desc: Build the release binary (target/release/almena-mediator)
    cmds:
      - cargo build --release --locked

  test:
    desc: Run the test suite
    cmds:
      - cargo test --locked {{.CLI_ARGS}}

  test:redis:
    desc: Run the test suite including the Redis store tests; Redis must be running (task redis)
    env:
      ALMENA_TEST_REDIS_URL: redis://127.0.0.1:{{.ALMENA_REDIS_PORT | default "6379"}}
    cmds:
      - cargo test --locked {{.CLI_ARGS}}

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt

  lint:
    desc: Check formatting and run clippy with warnings as errors
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets --locked -- -D warnings

  check:
    desc: Everything that must pass before finishing a change (lint + test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Remove build output, the Veramo client's installed packages and copied certificate, and the local Docker image
    cmds:
      - cargo clean
      - rm -rf interop/veramo/node_modules interop/veramo/caddy-root.crt
      - docker image rm -f {{.IMAGE}}

  clean:all:
    desc: Leave the repository as cloned — clean, plus the containers and their volumes, .env, the local keys, Caddy's certificates, the interop clients' packages and the Task checksums (the push credentials in secrets/ are kept)
    prompt: Remove the containers and volumes (keys, Redis), .env, the local keys in data/ and Caddy's certificates? The mediator's DID changes with new keys.
    cmds:
      # By the project's name, away from compose.yml: it needs no .env, so a
      # second run, or one after .env is gone, still works.
      - cd / && docker compose --project-name almena-mediator down --volumes --remove-orphans
      - task: clean
      - rm -rf data caddy .task
      - find interop -name node_modules -type d -prune -exec rm -rf {} +
      - find . -maxdepth 1 -name '.env*' ! -name '.env.example' -exec rm -f {} +

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the mediator in Docker (detached) and wait until it is healthy
    cmds:
      - docker compose up --build --detach --wait

  down:
    desc: Stop and remove the Docker containers
    cmds:
      - docker compose down

  down:volume:
    desc: Stop and remove the Docker containers and their volumes (deletes the Redis data)
    cmds:
      - docker compose down --volumes --remove-orphans

  rotate-keys:
    desc: Replace the Docker mediator's keys with new ones and restart it (messages in flight to the old keys are refused)
    prompt: Rotate the mediator's keys? Whatever was encrypted to the old ones will be refused.
    cmds:
      - docker compose exec mediator almena-mediator rotate-keys
      - docker compose restart mediator

  logs:turn:
    desc: Follow the TURN relay's container logs
    cmds:
      - docker compose logs --follow coturn

  logs:
    desc: Follow the mediator's container logs
    cmds:
      - docker compose logs --follow mediator

  did:
    desc: Show the running mediator's DID document
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.ALMENA_MEDIATOR_PORT | default "8080"}}/.well-known/did.json
      - echo
    silent: true

  health:
    desc: Query the running mediator's health endpoint
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.ALMENA_MEDIATOR_PORT | default "8080"}}/health
      - echo
    silent: true
