[package]
name = "almena-didcomm"
description = "DIDComm Messaging v2.0: messages, envelopes, crypto and DID resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
aes-kw = "0.3.1"
async-trait = "0.1.92"
base64 = "0.23.1"
bs58 = "0.5.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
k256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdh"] }
p521 = { version = "0.14.0", features = ["ecdh"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
