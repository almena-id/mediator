# Builds the mediator's Docker image for linux/amd64 and linux/arm64 whenever
# something is merged into main, and publishes it to GitHub Container Registry
# as ghcr.io/almena-id/mediator.
#
# Versions are year.month.sequence (e.g. 2026.09.1): the sequence starts at 1
# each month and goes up by one per publication. It is worked out from the git
# tags v<year>.<month>.<n>, and the tag for the new version is created once
# the image is out, so a failed build does not use up a number. Runs queue up
# (never in parallel), so two merges cannot take the same number.
#
# Each architecture builds on its own native runner, in parallel (no
# emulation), and pushes its image by digest; the last job joins both into one
# multi-architecture image and tags it:
#
#   2026.09.1       this version, never moves
#   latest          the newest build of main
#   sha-<commit>    this exact commit (7 characters), never moves
#
# The version is compiled into the binary (ALMENA_VERSION): /health, the logs
# and the metrics report it.

name: Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/almena-id/mediator

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next year.month.sequence
        id: next
        run: |
          month=$(date -u +%Y.%m)
          last=$(git tag --list "v${month}.*" | sed "s/^v${month}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          version="${month}.$(( ${last:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ALMENA_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Keep the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      # contents: the version tag; packages: the image.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join both architectures under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${{ env.IMAGE }}@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Show the result
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.version.outputs.version }}"

      - name: Tag the commit with its version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
